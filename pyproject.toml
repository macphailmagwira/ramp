[tool.poetry]
package-mode = false
description = "Main API for Ramp platform."
authors = ["Macphail Magwira <macphail.magwira@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.45"}
alembic = ">=1.17.2,<2.0.0"
fastapi = ">=0.121.2,<0.122.0"
pydantic-settings = ">=2.12.0,<3.0.0"
uvicorn = { extras = ["standard"], version = ">=0.29.0,<0.31.0" }
python-jose = { version = ">=3.5.0,<4.0.0", extras = ["cryptography"] }
requests = ">=2.32.5,<3.0.0"
strawberry-graphql = { version = ">=0.286.0,<0.287.0", extras = ["fastapi"] }
python-json-logger = ">=4.0.0,<5.0.0"
asyncpg = ">=0.30.0,<0.31.0"
greenlet = "^3.2.4"
python-dotenv = "^1.0.0"

# Celery with Redis and SQS support
celery = {extras = ["sqs"], version = "^5.6.2"}
celery-redbeat = "^2.3.3"
redis = ">=5.0.0,<6.0.0"

# AWS SDK for SQS broker
boto3 = ">=1.34.0,<2.0.0"

# Kombu with SQS transport (Celery's messaging library)
kombu = {extras = ["sqs"], version = ">=5.3.0,<6.0.0"}

# Required for SQS broker (pycurl alternative - use if needed)
# pycurl can be tricky to install, so we'll use urllib3 which kombu supports
urllib3 = ">=2.0.0,<3.0.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
slowapi = "^0.1.9"
gunicorn = "^23.0.0"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
python-multipart = "^0.0.21"
nest-asyncio = "^1.6.0"
pyarrow = "^23.0.0"
botocore = "^1.42.61"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.1,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
faker = ">=38.0.0,<39.0.0"
factory-boy = ">=3.3.3,<4.0.0"
httpx = ">=0.28.1,<0.29.0"
ruff = "^0.14.6"
mypy = "^1.18.2"
moto = {extras = ["sqs"], version = ">=5.0.0,<6.0.0"}  # Mock AWS services for testing
pytest-mock = "^3.15.1"
black = "^25.12.0"
pre-commit = "^4.5.1"
ipython = "^9.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/alembic/*", "*/__init__.py"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I"]

ignore = [
    "E501",  # line length handled by formatter
]
exclude = [
    "migrations/versions"
]

# Enable Ruff's built-in formatter (Black-compatible)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Sorting imports (replaces isort)
[tool.ruff.lint.isort]
combine-as-imports = true
