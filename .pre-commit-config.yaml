default_stages: [pre-commit]

# Keep the more comprehensive exclude from the existing file
exclude: ^(venv/|\.vscode/|docs/|node_modules/|dist/|\.nx/cache/)

repos:
  # General file hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Updated from v4.5.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents] # Added args
      - id: check-json # Added
      - id: check-toml # Added
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048'] # Added args, 2MB limit

  # Python specific hooks
  - repo: https://github.com/psf/black
    rev: 24.4.2 # Updated from 24.3.0
    hooks:
      - id: black
        args: [--line-length=100]
        # language_version: python3.10 # User can uncomment if needed

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0 # Kept version
    hooks:
      - id: flake8
        args:
          - --max-line-length=100
          - --ignore=E203,W503 # Added standard args
        # additional_dependencies: [] # User can add plugins here if needed

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2 # Kept version
    hooks:
      - id: isort
        name: isort (python) # Added name
        args: ['--profile', 'black', '--filter-files'] # Added --filter-files

  # ─────────────────────────────────────────────
  # JavaScript/TypeScript specific hooks
  - repo: local
    hooks:
      - id: eslint-local
        name: 'ESLint (using local node_modules)'
        entry: npx eslint
        language: system
        types: [javascript, jsx, ts, tsx]
        args: [--fix]
        # If you need to pass additional flags, you can add them under `args:` above.
        # This will run exactly the same ESLint you invoke locally (so it sees globals, plugins, etc.).

  # Keep Prettier (remote mirror) if you still want automatic formatting via pre-commit:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0 # Prettier v3 mirror
    hooks:
      - id: prettier
        args: [--write]
        types_or:
          [javascript, jsx, ts, tsx, json, css, scss, html, yaml, markdown]
