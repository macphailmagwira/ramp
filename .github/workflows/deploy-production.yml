name: Build and Deploy to Production EC2
on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/deploy-production.yml'
      - 'docker-compose*.yml'
      - 'Dockerfile*'

concurrency:
  group: production-deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
  NODE_VERSION: '20'
  PNPM_VERSION: '10.10.0'
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.3'

permissions:
  id-token: write
  contents: read
  actions: write
  checks: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine target environment
        id: env
        run: |
          ENVIRONMENT="PRODUCTION"   # uppercase
          ...
          if [[ "$BRANCH" == "main" ]]; then
            ENVIRONMENT="PRODUCTION"
          fi

  build-api:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.api-image.outputs.api_image }}
    env:
      ENVIRONMENT: ${{ needs.detect-changes.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514145637758:role/GitHubActions-StitchSense-DeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          export NODE_OPTIONS="--max-old-space-size=6144"
          pnpm install --no-frozen-lockfile

          if [ -f apps/api-main/pyproject.toml ]; then
            cd apps/api-main
            poetry config virtualenvs.in-project true
            poetry install --no-interaction --no-ansi
            cd ../..
          else
            echo "⏭️  No pyproject.toml found for API, skipping Python dependencies"
          fi

      - name: Build & push API Docker image
        id: build-push
        run: |
          ECR_REPOSITORY="stitchsense-production-api-main"
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE_URI="${{ env.ECR_REGISTRY }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building API image..."
          docker compose -f docker-compose.yml build api-main
          docker tag stitchsense-monorepo-api-main:latest ${FULL_IMAGE_URI}
          docker tag stitchsense-monorepo-api-main:latest ${{ env.ECR_REGISTRY }}/${ECR_REPOSITORY}:latest-production

          echo "Creating ECR repository if needed..."
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256

          echo "Logging in to ECR..."
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"

          echo "Pushing images..."
          docker push ${FULL_IMAGE_URI}
          docker push ${{ env.ECR_REGISTRY }}/${ECR_REPOSITORY}:latest-production

          echo "✅ Image pushed: ${FULL_IMAGE_URI}"

      - name: Set API image output
        id: api-image
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/stitchsense-production-api-main:${{ github.sha }}"
          echo "${IMAGE_URI}" > api-image.txt
          echo "api_image=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "✅ API Image URI saved"

      - name: Upload API image artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-image-uri
          path: api-image.txt
          retention-days: 1

  build-worker:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    outputs:
      worker_image: ${{ steps.worker-image.outputs.worker_image }}
    env:
      ENVIRONMENT: ${{ needs.detect-changes.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514145637758:role/GitHubActions-StitchSense-DeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          export NODE_OPTIONS="--max-old-space-size=6144"
          pnpm install --no-frozen-lockfile

          if [ -f apps/worker-main/pyproject.toml ]; then
            cd apps/worker-main
            poetry config virtualenvs.in-project true
            poetry install --no-interaction --no-ansi
            cd ../..
          else
            echo "⏭️  No pyproject.toml found for Worker, skipping Python dependencies"
          fi

      - name: Build & push Worker Docker image
        id: build-push
        run: |
          ECR_REPOSITORY="stitchsense-production-worker-main"
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE_URI="${{ env.ECR_REGISTRY }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building Worker image..."
          docker compose -f docker-compose.yml build celery-worker-main
          docker tag stitchsense-monorepo-celery-worker-main:latest ${FULL_IMAGE_URI}
          docker tag stitchsense-monorepo-celery-worker-main:latest ${{ env.ECR_REGISTRY }}/${ECR_REPOSITORY}:latest-production

          echo "Creating ECR repository if needed..."
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256

          echo "Logging in to ECR..."
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"

          echo "Pushing images..."
          docker push ${FULL_IMAGE_URI}
          docker push ${{ env.ECR_REGISTRY }}/${ECR_REPOSITORY}:latest-production

          echo "✅ Image pushed: ${FULL_IMAGE_URI}"

      - name: Set Worker image output
        id: worker-image
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/stitchsense-production-worker-main:${{ github.sha }}"
          echo "${IMAGE_URI}" > worker-image.txt
          echo "worker_image=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "✅ Worker Image URI saved"

      - name: Upload Worker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-image-uri
          path: worker-image.txt
          retention-days: 1

  deploy-to-ec2:
    needs: [build-api, build-worker]
    if: |
      always() &&
      needs.build-api.result == 'success' &&
      needs.build-worker.result == 'success'
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514145637758:role/GitHubActions-StitchSense-DeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Download API image artifact
        uses: actions/download-artifact@v4
        with:
          name: api-image-uri

      - name: Download Worker image artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-image-uri

      - name: Read image URIs from artifacts
        id: images
        run: |
          API_IMAGE=$(cat api-image.txt)
          WORKER_IMAGE=$(cat worker-image.txt)

          echo "🔍 Image URIs from artifacts:"
          echo "API: ${API_IMAGE}"
          echo "Worker: ${WORKER_IMAGE}"

          if [[ -z "$API_IMAGE" ]]; then
            echo "❌ API_IMAGE is empty"
            exit 1
          fi
          if [[ -z "$WORKER_IMAGE" ]]; then
            echo "❌ WORKER_IMAGE is empty"
            exit 1
          fi

          echo "api_image=${API_IMAGE}" >> $GITHUB_OUTPUT
          echo "worker_image=${WORKER_IMAGE}" >> $GITHUB_OUTPUT

      - name: Get Production EC2 instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=stitchsense-production-ec2" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "❌ Production EC2 instance not found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "✅ Found Production instance: $INSTANCE_ID"

      - name: Deploy Docker services via SSM
        run: |
          INSTANCE_ID="${{ steps.get-instance.outputs.instance_id }}"
          API_IMAGE="${{ steps.images.outputs.api_image }}"
          WORKER_IMAGE="${{ steps.images.outputs.worker_image }}"

          echo "🚀 Deploying images:"
          echo "  API: $API_IMAGE"
          echo "  Worker: $WORKER_IMAGE"

          cat > /tmp/ssm-commands.json << 'EOF'
          {
            "InstanceIds": ["INSTANCE_ID_PLACEHOLDER"],
            "DocumentName": "AWS-RunShellScript",
            "TimeoutSeconds": 600,
            "Parameters": {
              "commands": [
                "#!/bin/bash",
                "set -e",
                "echo '🚀 Starting Docker deployment to PRODUCTION...'",
                "",
                "echo '═══════════════════════════════════════════════════════════════'",
                "echo '📊 PRE-DEPLOYMENT DISK USAGE'",
                "echo '═══════════════════════════════════════════════════════════════'",
                "df -h / | grep -v Filesystem",
                "echo ''",
                "echo 'Docker disk usage:'",
                "docker system df || true",
                "echo '═══════════════════════════════════════════════════════════════'",
                "echo ''",
                "",
                "echo '📦 Fetching environment variables from SSM Parameter Store...'",
                "",
                "PARAMS_JSON=$(aws ssm get-parameters-by-path --path '/stitchsense/prod' --recursive --with-decryption --output json)",
                "",
                "ENV_FILE='/tmp/production.env'",
                "",
                "echo \"$PARAMS_JSON\" | jq -r '.Parameters[] | select(.Name | contains(\"deployment\") | not) | .Name + \"=\" + .Value' | while read -r line; do",
                "  param_name=$(echo \"$line\" | cut -d'=' -f1)",
                "  param_value=$(echo \"$line\" | cut -d'=' -f2-)",
                "  env_key=$(echo \"$param_name\" | sed 's|^/stitchsense/production/||' | tr '/' '_' | tr '[:lower:]' '[:upper:]')",
                "  if [[ \"$env_key\" == *'PASSWORD'* || \"$env_key\" == *'SECRET'* || \"$env_key\" == *'KEY'* || \"$env_key\" == *'TOKEN'* ]]; then",
                "    echo \"  ✓ $env_key: [REDACTED]\"",
                "  else",
                "    echo \"  ✓ $env_key: ${param_value:0:50}...\"",
                "  fi",
                "done",
                "",
                "echo \"$PARAMS_JSON\" | jq -r '.Parameters[] | select(.Name | contains(\"deployment\") | not) | (.Name | sub(\"^/stitchsense/production/\"; \"\") | gsub(\"/\"; \"_\") | ascii_upcase) + \"=\" + .Value' > $ENV_FILE",
                "",
                "PARAM_COUNT=$(wc -l < $ENV_FILE)",
                "",
                "if [[ $PARAM_COUNT -eq 0 ]]; then",
                "  echo '⚠️  WARNING: No parameters found in /stitchsense/production'",
                "  exit 1",
                "fi",
                "",
                "echo ''",
                "echo \"✅ Loaded $PARAM_COUNT environment variables from SSM\"",
                "",
                "echo 'Logging in to ECR...'",
                "aws ecr get-login-password --region 'AWS_REGION_PLACEHOLDER' | docker login --username AWS --password-stdin 'ECR_REGISTRY_PLACEHOLDER'",
                "",
                "echo 'Pulling images...'",
                "docker pull 'API_IMAGE_PLACEHOLDER'",
                "docker pull 'WORKER_IMAGE_PLACEHOLDER'",
                "",
                "echo 'Stopping old containers...'",
                "docker stop stitchsense-api-production 2>/dev/null || true",
                "docker stop stitchsense-worker-production 2>/dev/null || true",
                "docker rm stitchsense-api-production 2>/dev/null || true",
                "docker rm stitchsense-worker-production 2>/dev/null || true",
                "",
                "echo 'Creating Docker network if not exists...'",
                "docker network create stitchsense-network 2>/dev/null || true",
                "",
                "echo 'Starting API container with environment file...'",
                "docker run -d \\",
                "  --name stitchsense-api-production \\",
                "  --network stitchsense-network \\",
                "  -p 8000:8000 \\",
                "  --env-file $ENV_FILE \\",
                "  --restart unless-stopped \\",
                "  'API_IMAGE_PLACEHOLDER'",
                "",
                "echo 'Waiting for API container to be ready...'",
                "sleep 10",
                "",
                "echo '🗄️  Running Alembic migrations...'",
                "echo 'Checking current migration status...'",
                "docker exec stitchsense-api-production alembic current || echo 'No current revision'",
                "",
                "echo 'Starting migration upgrade...'",
                "timeout 300 docker exec stitchsense-api-production alembic upgrade head",
                "MIGRATION_EXIT=$?",
                "",
                "if [ $MIGRATION_EXIT -eq 124 ]; then",
                "  echo '❌ Migration timed out after 5 minutes'",
                "  docker logs --tail 200 stitchsense-api-production",
                "  exit 1",
                "elif [ $MIGRATION_EXIT -ne 0 ]; then",
                "  echo '❌ Migration failed with exit code: $MIGRATION_EXIT'",
                "  docker logs --tail 200 stitchsense-api-production",
                "  exit 1",
                "fi",
                "",
                "echo '✅ Database migrations completed successfully'",
                "docker exec stitchsense-api-production alembic current",
                "",
                "echo 'Starting Worker container with environment file...'",
                "docker run -d \\",
                "  --name stitchsense-worker-production \\",
                "  --network stitchsense-network \\",
                "  --env-file $ENV_FILE \\",
                "  --restart unless-stopped \\",
                "  'WORKER_IMAGE_PLACEHOLDER' \\",
                "  celery -A src.core.celery_app worker --loglevel=info --concurrency=4 --queues=s3-events,celery,default",
                "",
                "echo 'Waiting for services to stabilize...'",
                "sleep 15",
                "",
                "echo ''",
                "echo '═══════════════════════════════════════════════════════════════'",
                "echo '🧹 CLEANING UP DOCKER RESOURCES'",
                "echo '═══════════════════════════════════════════════════════════════'",
                "",
                "docker container prune -f",
                "docker image prune -f",
                "docker image prune -a -f",
                "docker volume prune -f",
                "docker builder prune -f",
                "docker network prune -f",
                "",
                "echo ''",
                "echo '═══════════════════════════════════════════════════════════════'",
                "echo '📊 POST-DEPLOYMENT DISK USAGE'",
                "echo '═══════════════════════════════════════════════════════════════'",
                "df -h / | grep -v Filesystem",
                "echo ''",
                "echo 'Docker disk usage after cleanup:'",
                "docker system df",
                "echo '═══════════════════════════════════════════════════════════════'",
                "echo ''",
                "",
                "echo '📊 Container status:'",
                "docker ps --filter name=stitchsense",
                "",
                "echo ''",
                "echo '📝 API logs (last 200 lines):'",
                "docker logs --tail 200 stitchsense-api-production",
                "",
                "echo ''",
                "echo '📝 Worker logs (last 200 lines):'",
                "docker logs --tail 200 stitchsense-worker-production",
                "",
                "echo ''",
                "echo '✅ Deployment complete!'"
              ]
            }
          }
          EOF

          sed -i "s|INSTANCE_ID_PLACEHOLDER|${INSTANCE_ID}|g" /tmp/ssm-commands.json
          sed -i "s|API_IMAGE_PLACEHOLDER|${API_IMAGE}|g" /tmp/ssm-commands.json
          sed -i "s|WORKER_IMAGE_PLACEHOLDER|${WORKER_IMAGE}|g" /tmp/ssm-commands.json
          sed -i "s|AWS_REGION_PLACEHOLDER|${{ env.AWS_REGION }}|g" /tmp/ssm-commands.json
          sed -i "s|ECR_REGISTRY_PLACEHOLDER|${{ env.ECR_REGISTRY }}|g" /tmp/ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-commands.json \
            --timeout-seconds 600 \
            --output text \
            --query 'Command.CommandId')

          echo "📋 SSM Command ID: $COMMAND_ID"
          echo "⏳ Waiting for deployment to complete..."

          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(aws ssm list-commands \
              --command-id "$COMMAND_ID" \
              --region "${{ env.AWS_REGION }}" \
              --query 'Commands[0].Status' \
              --output text)

            echo "⏱️  Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS - Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed successfully!"
              echo ""
              echo "📄 Deployment output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardOutputContent' \
                --output text | tail -50
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo ""
              echo "📄 Standard Output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardOutputContent' \
                --output text | tail -100
              echo ""
              echo "⚠️  Error Output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 5
          done

          echo "⚠️  Timeout after 5 minutes waiting for deployment"
          echo "💡 Command may still be running. Check manually:"
          echo "   aws ssm list-commands --command-id $COMMAND_ID --region ${{ env.AWS_REGION }}"
          exit 1

  deployment-summary:
    needs: [detect-changes, build-api, build-worker, deploy-to-ec2]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Build API**: ${{ needs.build-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Worker**: ${{ needs.build-worker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy to EC2**: ${{ needs.deploy-to-ec2.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ needs.build-api.outputs.api_image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: ${{ needs.build-worker.outputs.worker_image }}" >> $GITHUB_STEP_SUMMARY